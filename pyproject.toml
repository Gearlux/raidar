[project]
name = "raidar"
version = "0.1.0"
description = "Object-detection models and a standard-Lightning detector (Faster R-CNN, RF-DETR, D-FINE, RT-DETRv2)."
authors = [{name = "Taidal"}]
license = {text = "MIT"}
dependencies = [
    # marainer provides OPTIONAL tracking + torch utilities (ensure_record_dataset /
    # load_lightning_checkpoint / DetectionOutput contracts). raidar's LightningDetector is a
    # standard pl.LightningModule and trains without marainer (a couple of tracking lines drop out).
    "marainer[lightning,mlflow,tensorboard]>=0.1.0",
    "confluid>=0.1.0",
    "recordstream>=0.1.0",
    "loggair>=0.1.0",
    "torch",
    "torchvision",
    "torchmetrics[detection]",
    "pycocotools",
    "pytorch-lightning",
    # rfdetr[train,loggers]: the [train] extra pulls PTL + RF-DETR's native training
    # stack (RFDETRModelModule / RFDETRDataModule / build_trainer) the native
    # RFDETRTrainer drives; [loggers] pulls its TensorBoard/MLflow integrations.
    "rfdetr[train,loggers]>=1.6.0",
    # RF-DETR's COCOEvalCallback computes mAP via torchmetrics' faster_coco_eval
    # backend; it is NOT pulled by rfdetr[train], so eval needs it explicitly.
    "faster-coco-eval",
    # Hugging Face transformers detectors (D-FINE / RT-DETRv2 — raidar.hf_detection),
    # both Apache-2.0. transformers>=4.49 has DFineForObjectDetection (v4.48) +
    # RTDetrV2ForObjectDetection (v4.49); timm backs the detection backbones; scipy
    # provides the Hungarian matcher used in the DETR-family training loss.
    "transformers>=4.49",
    "timm",
    "scipy",
]
requires-python = ">=3.12"

[project.entry-points."confluid.configurables"]
raidar = "raidar"
# torchvision detection builder FUNCTIONS (lazy, role-less) — see raidar/configurables.py.
raidar-configurables = "raidar.configurables"

[project.scripts]
raidar = "raidar.cli:main"
raidar-rfdetr = "raidar.rfdetr_cli:main"

# Liquifai app registration: lets `liquifai-install-completions` discover this
# CLI via an instant entry-point metadata read instead of executing the binary
# (subprocess probe, 15 s timeout each). Name = the app/binary name; value =
# the LiquifyApp instance. Entry-point changes need an editable reinstall.
[project.entry-points."liquifai.apps"]
raidar = "raidar.cli:app"
raidar-rfdetr = "raidar.rfdetr_cli:app"

[project.optional-dependencies]
dev = [
    "black>=24.0.0,<25.0.0",
    "isort>=5.13.0,<6.0.0",
    "flake8>=6.0.0,<8.0.0",
    "mypy>=1.0.0,<2.0.0",
    "pytest>=7.0.0,<9.0.0",
    "pytest-cov>=4.0.0,<7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["raidar*"]

[tool.setuptools.package-data]
raidar = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: heavy end-to-end tests (e.g. a real RF-DETR train epoch); deselect with -m 'not slow'.",
]

[tool.coverage.run]
source = ["raidar"]
branch = true

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
