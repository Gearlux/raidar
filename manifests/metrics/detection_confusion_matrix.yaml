description: "Confusion-matrix-style detection metric: TP / FP / FN with derived precision / recall / F1."
use_case: "Use when the comparison axis is 'minimize FN' or 'minimize FP' rather than mAP. Greedy class-aware matching at a single IoU and score threshold; surfaces six scalars (tp, fp, fn, precision, recall, f1). Pair with DetectionMetricAdapter+MeanAveragePrecision in a MetricCollection so a single val_metrics block reports both views."
category: "Detection"
flux_type: "Metric"
task: "object_detection"
class_path: "raidar.detection.DetectionConfusionMatrix"
params:
  iou_threshold:
    type: "float"
    default: 0.5
    description: "Minimum IoU (with a same-class GT) required to count a prediction as a true positive."
  score_threshold:
    type: "float"
    default: 0.25
    description: "Predictions with lower confidence are filtered out before matching."
  prefix:
    type: "str"
    default: ""
    description: "Optional prefix prepended to every surfaced key (e.g. 'det/')."
