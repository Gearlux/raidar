description: "torchmetrics.detection.MeanAveragePrecision — COCO-style mAP/mAR at varying IoU and area scales."
use_case: "Standard detection metric. ALWAYS wrap inside DetectionMetricAdapter — torchmetrics' raw API expects (preds, target) lists but raidar models emit DetectionStepOutput. The adapter surfaces map / map_50 / mar_100 etc. as Lightning-loggable scalars."
category: "Detection"
flux_type: "Metric"
task: "object_detection"
class_path: "torchmetrics.detection.MeanAveragePrecision"
needs_wrapper: "raidar.detection.DetectionMetricAdapter"
params:
  iou_type:
    type: "str"
    default: "bbox"
    choices: ["bbox", "segm"]
    description: "Match by box IoU ('bbox') or by segmentation-mask IoU ('segm')."
  class_metrics:
    type: "bool"
    default: false
    description: "Also compute per-class mAP. Setting true emits non-scalar 'map_per_class' / 'mar_100_per_class' which the adapter excludes from the surfaced views."
  iou_thresholds:
    type: "List[float] | null"
    default: null
    description: "Optional explicit IoU thresholds for the mAP sweep. Default is [0.5, 0.55, ..., 0.95] (COCO standard)."
  rec_thresholds:
    type: "List[float] | null"
    default: null
    description: "Optional explicit recall thresholds for the AP integral. Default is [0.0, 0.01, ..., 1.0]."
