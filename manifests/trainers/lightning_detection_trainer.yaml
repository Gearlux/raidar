description: "LightningDetectionTrainer: specialised object-detection trainer that overrides Lightning step functions to consume torchvision-native detection models and torchmetrics MAP directly — no raidar adapter layer."
use_case: "Drop-in replacement for LightningTrainer when training detection models. Consumes models whose forward returns Dict[str, Tensor] in train (loss dict) and List[Dict[str, Tensor]] in eval (per-image predictions). Raw torchvision Faster R-CNN works out of the box; RF-DETR ships a native module at raidar.rfdetr.RFDETRModel; ultralytics-family detectors (YOLO26 / RT-DETR) ship native modules in the raidar-ultralytics sibling package (raidar_ultralytics.yolo26.YOLO26Model / raidar_ultralytics.rtdetr.RTDETRModel). Invoke via `raidar train` or `marainer detection train`. For the marainer-generic flow (model returns DetectionStepOutput; raidar adapters sum loss / unwrap predictions), use marainer.trainer.LightningTrainer with the *_marainer.py wrappers instead."
category: "Detection"
flux_type: "LightningDetectionTrainer"
class_path: "raidar.lightning_trainer.LightningDetectionTrainer"
params:
  model:
    type: "torch.nn.Module"
    required: true
    description: "Torchvision-native detection model. forward(images, targets) returns a loss dict in train; forward(images) returns a per-image predictions list in eval. Raw torchvision Faster R-CNN works; RF-DETR via raidar.rfdetr.RFDETRModel; ultralytics-family detectors via raidar_ultralytics.{yolo26,rtdetr}.*Model."
  train_set:
    type: "Any"
    required: true
    description: "Training dataset or Flux pipeline. Each sample carries input=[3,H,W] image, target={boxes:[N,4], labels:[N]}."
  num_classes:
    type: "int"
    required: true
    description: "Number of output classes (including background where applicable). Surfaced for parity; metrics are class-count-agnostic."
  val_set:
    type: "Any | null"
    default: null
    description: "Validation dataset or Flux pipeline."
  test_set:
    type: "Any | null"
    default: null
    description: "Held-out test dataset. When set, lightning.test() runs after fit()."
  optimizer:
    type: "Lazy[torch.optim.Optimizer]"
    default: "Class(torch.optim.AdamW, lr=1e-4, weight_decay=0.05)"
    description: "Optimizer (deferred). Default: AdamW with learning rate 1e-4."
  train_loader:
    type: "Lazy[DataLoader]"
    default: "Class(DataLoader, collate_fn=detection_collate_fn)"
    description: "DataLoader config for training data. detection_collate_fn is baked in (preserves variable-length per-image targets)."
  val_loader:
    type: "Lazy[DataLoader]"
    default: "Class(DataLoader, collate_fn=detection_collate_fn)"
    description: "DataLoader config for validation data."
  test_loader:
    type: "Lazy[DataLoader]"
    default: "Class(DataLoader, collate_fn=detection_collate_fn)"
    description: "DataLoader config for test data."
  lightning:
    type: "Lazy[pytorch_lightning.Trainer]"
    default: "Class(L.Trainer)"
    description: "PyTorch Lightning Trainer config."
  experiment_name:
    type: "str"
    default: "raidar_detection"
    description: "MLflow experiment name."
  run_name:
    type: "str"
    default: "train"
    description: "MLflow run name."
  val_metrics:
    type: "torchmetrics.Metric | torchmetrics.MetricCollection | Lazy"
    default: "Class(MeanAveragePrecision, iou_type=bbox)"
    description: "Validation metric consumed via update(predictions, targets) — single torchmetrics Metric or a MetricCollection. Use a MetricCollection to combine MAP with raidar.detection.DetectionConfusionMatrixNative."
  test_metrics:
    type: "torchmetrics.Metric | torchmetrics.MetricCollection | Lazy"
    default: "Class(MeanAveragePrecision, iou_type=bbox)"
    description: "Test metric, independent state from val."
