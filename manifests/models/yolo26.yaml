description: "Ultralytics YOLO26 wrapped for the Marainer Trainer flow."
use_case: "End-to-end NMS-free object detector. Body-pretrained / head-fresh by default; pair with TorchvisionDetectionLoss (no per-component weights — Ultralytics balances internally) and DetectionMetricAdapter+MeanAveragePrecision for val. Best for small-dataset edge inference."
category: "Detection"
flux_type: "Model"
task: "object_detection"
class_path: "raidar.yolo26.YOLO26Model"
params:
  num_classes:
    type: "int"
    default: 1
    description: "Foreground class count. YOLO uses 0..nc-1 directly (no background slot)."
  variant:
    type: "str"
    default: "n"
    choices: ["n", "s", "m", "l", "x"]
    description: "Model size — nano (n) ~2.5M params through xlarge (x). Speed/accuracy trade-off."
  pretrained_detector:
    type: "bool"
    default: true
    description: "Load full COCO-pretrained YOLO26 weights. Classifier convs are skipped if num_classes != 80; backbone+neck+regression head stay pretrained."
  imgsz:
    type: "int"
    default: 640
    description: "Square input size (must be a multiple of 32). All images in a batch must already be [3, imgsz, imgsz]."
  score_threshold:
    type: "float"
    default: 0.25
    description: "Eval-time confidence cutoff applied before packing predictions."
  agnostic_nms:
    type: "bool"
    default: false
    description: "Class-agnostic top-k selection in the end-to-end head."
  compute_val_loss:
    type: "bool"
    default: true
    description: "When False, skips the loss recomputation during eval (faster, but val/loss not reported)."
  checkpoint_path:
    type: "str | null"
    default: null
    description: "Optional Lightning .ckpt path. Loaded after pretrained_detector so checkpoint values win."
  checkpoint_strict:
    type: "bool"
    default: false
    description: "Forwarded to load_state_dict(strict=...). False allows e.g. a different num_classes."
