description: "Marainer-generic wrapper around raidar.rfdetr.RFDETRModel — returns DetectionStepOutput for the unchanged base LightningTrainer flow."
use_case: "Use with marainer.trainer.LightningTrainer + raidar.detection.TorchvisionDetectionLoss + raidar.detection.DetectionMetricAdapter. Inherits the native RFDETRModel build and overrides forward to consume DetectionBatchInput. Adds a no-grad val-loss recompute (RF-DETR is BN-free). For the specialised trainer path (no adapter layer), use raidar.rfdetr.RFDETRModel directly."
category: "Detection"
flux_type: "Model"
task: "object_detection"
class_path: "raidar.rfdetr_marainer.RFDETRMarainerModel"
params:
  num_classes:
    type: "int"
    default: 1
    description: "Foreground class count."
  variant:
    type: "str"
    default: "nano"
    choices: ["nano", "small", "medium", "large"]
    description: "Model size."
  pretrained_detector:
    type: "bool"
    default: true
    description: "Load full COCO-pretrained RF-DETR weights."
  resolution:
    type: "int | null"
    default: null
    description: "Square input size. None uses the variant's default."
  score_threshold:
    type: "float"
    default: 0.5
    description: "Eval-time confidence cutoff."
  compute_val_loss:
    type: "bool"
    default: true
    description: "When False, skips the eval-mode loss recomputation."
  checkpoint_path:
    type: "str | null"
    default: null
    description: "Optional Lightning .ckpt path."
  checkpoint_strict:
    type: "bool"
    default: false
    description: "Forwarded to load_state_dict(strict=...)."
