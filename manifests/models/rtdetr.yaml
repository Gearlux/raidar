description: "Ultralytics RT-DETR (Real-Time DEtection TRansformer) — torchvision-native wrapper for the specialised LightningDetectionTrainer."
use_case: "Transformer-based NMS-free detector with native torchvision forward contract. Drops into raidar.lightning_trainer.LightningDetectionTrainer directly — no raidar adapter layer. Always emits 300 raw queries per image — score_threshold keeps MAP tractable. For the marainer-generic path, see raidar.rtdetr_marainer.RTDETRMarainerModel."
category: "Detection"
flux_type: "Model"
task: "object_detection"
class_path: "raidar.rtdetr.RTDETRModel"
params:
  num_classes:
    type: "int"
    default: 1
    description: "Foreground class count. RT-DETR uses 0..nc-1 directly (no background slot)."
  variant:
    type: "str"
    default: "l"
    choices: ["l", "x", "resnet50", "resnet101"]
    description: "Model size: l (large, default) / x (xlarge) ship public COCO weights; resnet variants are architecture-only (set pretrained_detector=false)."
  pretrained_detector:
    type: "bool"
    default: true
    description: "Load full COCO-pretrained RT-DETR weights. Classifier heads skipped if num_classes != 80. Must be False for resnet variants."
  imgsz:
    type: "int"
    default: 640
    description: "Square input size (must be a multiple of 32). All images in a batch must already be [3, imgsz, imgsz]."
  score_threshold:
    type: "float"
    default: 0.25
    description: "Eval-time confidence cutoff applied to per-query max class probability."
  checkpoint_path:
    type: "str | null"
    default: null
    description: "Optional Lightning .ckpt path. Loaded after pretrained_detector so checkpoint values win."
  checkpoint_strict:
    type: "bool"
    default: false
    description: "Forwarded to load_state_dict(strict=...)."
