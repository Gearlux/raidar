# Train a torchvision Faster R-CNN on the HuggingFace **cppe-5** detection dataset
# via `raidar train`. cppe-5 is the "hello world" of HF object detection — 1000
# medical-PPE images, 5 classes (Coverall / Face_Shield / Gloves / Goggles / Mask),
# COCO-format boxes — the detection analogue of MNIST for classification.
#
# Mirrors sonair's flat HF classification config (train_efficientvit_b0_sonair.yaml):
# top-level keys are wired into the trainer by Confluid broadcasting (no nesting /
# !ref needed), and the !lazy: model gets `num_classes` injected at run time.
# cppe-5's 5 categories are 0-indexed (0..4); CocoToTorchVisionDetection's
# `label_offset: 1` shifts them to torchvision foreground ids 1..5 (class 0 =
# background), so num_classes = 6.
#
# Run:
#   raidar train examples/train_fasterrcnn_cppe5_hf.yaml
#
# SPEED — detection is heavy; the biggest lever is the MODEL, not the dataset size
# (torchvision resizes every image to the detector's min_size). This config uses the
# **MobileNetV3-320** Faster R-CNN (320×640 px) — far faster than the ResNet50-FPN
# variant (800×1333 px), which you can swap in below for higher accuracy. Other
# levers: cap records with `count:` on the source (commented below), drop
# `max_epochs`, or use a SMALLER dataset — any Roboflow-universe mirror with the same
# `objects` schema drops straight into this op chain, e.g. `path: Francesco/animals-ij5d2`.

runnable: !class:raidar.detector.LightningDetector
  task: fit
  experiment_name: cppe5_detection
  run_name: fasterrcnn_cppe5
  # Pinned (cppe-5 = 5 fg + background) — also skips the one-time startup walk that
  # would otherwise derive it by decoding every train image (HuggingFaceSource has no
  # target-only projection). Omit it to have initialize() derive max(label)+1 instead.
  num_classes: 6

# -- Model: RAW torchvision Faster R-CNN, wired !lazy: so initialize() injects
# num_classes at run time — no raidar wrapper (confluid flows the builder FUNCTION
# with num_classes=...). The MobileNetV3-320 variant is the fast default; for higher
# accuracy swap to the heavier ResNet50-FPN (slower — 800px input):
#   model: !lazy:torchvision.models.detection.fasterrcnn_resnet50_fpn
#     weights_backbone: DEFAULT
model: !lazy:torchvision.models.detection.fasterrcnn_mobilenet_v3_large_320_fpn
  weights_backbone: DEFAULT

# -- Shared op chain: HF `objects` annotation → detection target; PIL image → tensor.
detection_ops:
  - !class:recordstream.ops.target.CocoToTorchVisionDetection
    bbox_format: xywh        # cppe-5 boxes are COCO [x, y, w, h]
    label_offset: 1          # 0..4 → 1..5; reserve class 0 for background
  - !class:recordstream.ops.torch.ToTensor
    mode: RGB                # cppe-5 mixes RGB/RGBA/grayscale — force 3-channel for Faster R-CNN
    normalize: true

train_set: !class:recordstream.core.stream.Stream
  source: !class:recordstream.sources.huggingface.HuggingFaceSource
    path: cppe-5
    split: train
    input_feature: image
    target_feature: objects
    # count: 100             # uncomment to cap records for a quick smoke run
  ops: !ref:detection_ops

val_set: !class:recordstream.core.stream.Stream
  source: !class:recordstream.sources.huggingface.HuggingFaceSource
    path: cppe-5
    split: test               # cppe-5 ships train / test (no validation split)
    input_feature: image
    target_feature: objects
  ops: !ref:detection_ops

# -- Ergonomic flat knobs (broadcast into the trainer ctor) ----------------
batch_size: 2
num_workers: 4
max_epochs: 10
# val_metrics defaults to MeanAveragePrecision(iou_type="bbox"). To also track
# TP/FP/FN, set it to a torchmetrics.MetricCollection of MeanAveragePrecision +
# raidar.detection.DetectionConfusionMatrix (see lightning_train_native.yaml).
