# Specialised LightningDetectionTrainer — native detection model + raw torchmetrics.
#
# Demonstrates the specialised path: the trainer overrides step functions so
# it talks to a torchvision-native detection model
# (`forward(images, targets)→loss_dict` / `forward(images)→predictions list`)
# and a raw `torchmetrics.detection.MeanAveragePrecision` directly. No raidar
# adapter layer between trainer and loss/metric.
#
# This is the ONLY detection path — the matrainer-generic adapter layer
# (DetectionStepOutput / TorchvisionDetectionLoss / DetectionMetricAdapter) was
# removed; every detector runs through LightningDetectionTrainer.
#
# Run:
#   matrainer detection train examples/lightning_train_native.yaml
#   raidar train             examples/lightning_train_native.yaml

num_classes: 2

# -- Model: raw torchvision Faster R-CNN. `forward(images, targets)` returns a
# -- `Dict[str, Tensor]` loss dict in train mode; `forward(images)` returns
# -- a `List[Dict[str, Tensor]]` predictions list in eval mode — exactly what
# -- `LightningDetectionTrainer.training_step` / `validation_step` consume.
#
# Alternative ultralytics-family detectors (require raidar-ultralytics):
#   model: !class:raidar_ultralytics.yolo26.YOLO26Model
#     num_classes: !ref:num_classes
#     variant: n
#     pretrained_detector: false
#     imgsz: 256
model: !class:torchvision.models.detection.fasterrcnn_resnet50_fpn_v2
  num_classes: !ref:num_classes
  weights_backbone: DEFAULT

train_set: !class:raidar.examples_helpers.SyntheticDetectionDataset
  n: 16
  num_classes: !ref:num_classes
  image_size: 256

val_set: !class:raidar.examples_helpers.SyntheticDetectionDataset
  n: 4
  num_classes: !ref:num_classes
  image_size: 256

lightning: !class:pytorch_lightning.Trainer
  max_epochs: 1
  accelerator: cpu
  devices: 1
  log_every_n_steps: 1
  enable_progress_bar: true

runnable: !class:raidar.detector.LightningDetector
  task: fit
  experiment_name: raidar_native_smoke
  run_name: faster_rcnn_native
  num_classes: !ref:num_classes
  model: !ref:model
  train_set: !ref:train_set
  val_set: !ref:val_set
  lightning: !ref:lightning
  # val_metrics / test_metrics default to MeanAveragePrecision(iou_type="bbox").
  # Override examples — both are pure torchmetrics, no raidar wrapper:
  #
  #   val_metrics: !class:torchmetrics.detection.MeanAveragePrecision
  #     iou_type: bbox
  #     class_metrics: true
  #
  #   val_metrics: !class:torchmetrics.MetricCollection
  #     metrics:
  #       - !class:torchmetrics.detection.MeanAveragePrecision
  #         iou_type: bbox
  #       - !class:raidar.detection.DetectionConfusionMatrix
  #         iou_threshold: 0.5
