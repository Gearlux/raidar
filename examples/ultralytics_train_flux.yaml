# Train YOLO26 via Ultralytics' native trainer over in-memory `dataflux.Flux`
# objects — no on-disk YOLO data.yaml, no image directory, just the same
# Confluid-wired Flux pipeline the Lightning-driven `marainer train` flow uses.
#
# Run:
#   marainer ultralytics-train raidar/examples/ultralytics_train_flux.yaml
#
# Flux mode swaps the trainer for `FluxDetectionTrainer` whose `build_dataset`
# returns a `FluxYOLODataset(YOLODataset)` reading samples from the supplied
# Flux. Mosaic + albumentations + Ultralytics' LOGGER all stay live (unless
# `augment: false` is set — see ultralytics_train_flux_dataflux_aug.yaml for
# the dataflux-native augmentation pattern).
#
# This config sketches the wiring shape; pair the source / op chain with the
# real RFUAV pipeline from `waivefront-rfuav/config/train_yolo26.yaml` (or any
# Flux you already have).

class_names:
  0: drone-signal
num_classes: 1

train_set: !class:dataflux.core.Flux()
  source: []   # replace with a real DataSource (e.g. RegionsJsonSource)
  ops: []      # replace with the IQ → spectrogram → detection-target op chain

val_set: !class:dataflux.core.Flux()
  source: []
  ops: []

# Ergonomic Flux form — pass `train_set` / `val_set` / `num_classes` /
# `class_names` directly. The legacy `data: {train: ..., val: ..., names:
# {...}, nc: N}` dict form keeps working for back-compat; pick whichever
# reads better in your YAML.
trainer: !class:raidar.ultralytics_runner.UltralyticsTrainer
  train_set: !ref:train_set
  val_set: !ref:val_set
  num_classes: !ref:num_classes
  class_names: !ref:class_names
  variant: n
  pretrained: true
  imgsz: 640
  epochs: 50
  batch: 16
  experiment_name: yolo26n_rfuav_flux
  metrics_output_path: ./runs/yolo26n_rfuav_flux/metrics.json
  # Tune ultralytics' built-in augmentation pipeline directly from YAML —
  # the keys match ultralytics' own config vocabulary. Drop this block (or
  # set `augment: false`) to disable the pipeline entirely.
  augmentation:
    mosaic: 1.0
    mixup: 0.1
    hsv_h: 0.015
    hsv_s: 0.7
    hsv_v: 0.4
    fliplr: 0.5
    flipud: 0.0
  # Start from prior weights (Ultralytics .pt, Lightning .ckpt, or a plain
  # state-dict). Suppresses the COCO download since the checkpoint overwrites
  # those weights anyway. Flux mode currently grafts weights only — for full
  # epoch/optimizer-state resume use disk mode + extra_overrides.resume=true.
  # checkpoint: ./runs/yolo26n_rfuav_flux/weights/last.pt
  extra_overrides:
    workers: 4
    plots: false   # FluxDetectionTrainer overrides the plot helpers, but plots=false also suppresses ultralytics-side plotting
