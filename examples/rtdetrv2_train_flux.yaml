# Train RT-DETRv2 (Hugging Face transformers, Apache-2.0) on the HuggingFace
# **cppe-5** detection dataset, fed IN-MEMORY from a SampleFlux pipeline, via raidar's
# generic Lightning detection loop. cppe-5 = 1000 medical-PPE images, 5 classes.
#
# RT-DETRv2 ("DETRs Beat YOLOs on Real-time Object Detection", improved baseline)
# is an NMS-free real-time transformer detector — a permissively-licensed, well-
# maintained alternative to the AGPL ultralytics YOLO family, shipped straight from
# the installed `transformers`.
#
# Run:
#   raidar train examples/rtdetrv2_train_flux.yaml
#   raidar train examples/rtdetrv2_train_flux.yaml
#
# ⚠️ 0-INDEXED LABELS. HF detectors use class ids 0..K-1 with NO background class
# (OPPOSITE of torchvision's background-at-0): `label_offset: 0`, `num_classes: 5`.
# The wrapper resizes to a square `image_size` internally and expects [0,1] pixels
# (HF processor is do_normalize=False), so the op chain is the same as the Faster
# R-CNN example bar `label_offset`.

runnable: !class:raidar.detector.LightningDetector
  task: fit
  experiment_name: cppe5_rtdetrv2
  run_name: rtdetrv2_r50vd_cppe5
  num_classes: 5             # 5 FOREGROUND classes (0..4); injected into the !lazy: model

# -- Model: RT-DETRv2 wired !lazy: so initialize() injects num_classes at run time.
# variant: r18vd | r34vd | r50vd | r101vd (ResNet backbone). Use `variant: r18vd`
# for a faster smoke run.
model: !lazy:raidar.hf_detection.RTDETRv2Model
  variant: r50vd
  image_size: 640          # square side (multiple of 32); RT-DETRv2 trains at 640

# -- Shared op chain: HF `objects` annotation → detection target; PIL image → [0,1] tensor.
detection_ops:
  - !class:sampleflux.ops.target.CocoToTorchVisionDetection
    bbox_format: xywh        # cppe-5 boxes are COCO [x, y, w, h]
    label_offset: 0          # HF detectors are 0-indexed (no background) — do NOT +1
  - !class:sampleflux.ops.torch.ToTensor
    mode: RGB                # cppe-5 mixes RGB/RGBA/grayscale — force 3-channel
    normalize: true          # [0,255] → [0,1] (HF processor is do_normalize=False)

train_set: !class:sampleflux.core.Flux
  source: !class:sampleflux.sources.HuggingFaceSource
    path: cppe-5
    split: train
    input_feature: image
    target_feature: objects
    # count: 100             # uncomment to cap samples for a quick smoke run
  ops: !ref:detection_ops

val_set: !class:sampleflux.core.Flux
  source: !class:sampleflux.sources.HuggingFaceSource
    path: cppe-5
    split: test               # cppe-5 ships train / test (no validation split)
    input_feature: image
    target_feature: objects
  ops: !ref:detection_ops

# -- Ergonomic flat knobs (broadcast into the trainer ctor) ----------------
batch_size: 2
num_workers: 4
max_epochs: 10
