# Marainer-generic detection training — base LightningTrainer + raidar adapters.
#
# Demonstrates the marainer-generic path: a detector wrapped to return
# `raidar.detection.DetectionStepOutput` (here `YOLO26MarainerModel`), plus
# the adapters `TorchvisionDetectionLoss` (sums the loss dict) and
# `DetectionMetricAdapter` (wraps `MeanAveragePrecision` for the unchanged
# base step-function pattern).
#
# Run:
#   marainer train examples/lightning_train_disk.yaml
#
# For the *specialised* trainer path (no raidar adapters between trainer and
# native model/metric), see `lightning_train_native.yaml`.

num_classes: 2

# -- Model: YOLO26 wrapped to return DetectionStepOutput. The wrapper inherits
# -- the torchvision-native YOLO26Model and overrides `forward` to expose the
# -- {losses, predictions} shape the base trainer's adapter pattern expects.
model: !class:raidar.yolo26_marainer.YOLO26MarainerModel
  num_classes: !ref:num_classes
  variant: n
  pretrained_detector: false
  imgsz: 256
  score_threshold: 0.25
  compute_val_loss: true

train_set: !class:raidar.examples_helpers.SyntheticDetectionDataset
  n: 16
  num_classes: !ref:num_classes
  image_size: 256

val_set: !class:raidar.examples_helpers.SyntheticDetectionDataset
  n: 4
  num_classes: !ref:num_classes
  image_size: 256

# -- Loss adapter: sums the loss dict the model emits in train mode.
loss_fn: !class:raidar.detection.TorchvisionDetectionLoss

# -- Metric adapter: wraps torchmetrics MAP so it can consume
# -- DetectionStepOutput and surface per-key scalars to Lightning logs.
val_metrics: !class:raidar.detection.DetectionMetricAdapter
  inner: !class:torchmetrics.detection.MeanAveragePrecision
    iou_type: bbox
  prefix: "val/"

lightning: !class:pytorch_lightning.Trainer
  max_epochs: 1
  accelerator: cpu
  devices: 1
  log_every_n_steps: 1
  enable_progress_bar: true

trainer: !class:marainer.trainer.LightningTrainer
  experiment_name: raidar_marainer_generic_smoke
  run_name: yolo26_marainer_disk
  model: !ref:model
  train_set: !ref:train_set
  val_set: !ref:val_set
  lightning: !ref:lightning
  train_loader: !class:torch.utils.data.DataLoader
    batch_size: 2
    collate_fn: !ref:raidar.detection.detection_collate_fn
  val_loader: !class:torch.utils.data.DataLoader
    batch_size: 2
    collate_fn: !ref:raidar.detection.detection_collate_fn
