# Train YOLO26 via Ultralytics' native trainer (mosaic + albumentations + LOGGER)
# against a YOLO-format dataset on disk.
#
# Run:
#   marainer ultralytics-train raidar/examples/ultralytics_train_disk.yaml
#
# `data` here is the same path you would pass to `yolo train data=...`: a YOLO
# data.yaml describing `path:`, `train:`, `val:`, `names:`, `nc:`. Ultralytics
# resolves it via `check_det_dataset`, walks the disk, and runs its full
# training loop — including the augmentation pipeline (mosaic, mixup, cutmix,
# albumentations) that the Lightning-driven raidar.yolo26.YOLO26Model bypasses.

trainer: !class:raidar.ultralytics_runner.UltralyticsTrainer
  data: ./datasets/coco8/coco8.yaml
  variant: n
  pretrained: true
  imgsz: 640
  epochs: 100
  batch: 16
  experiment_name: yolo26n_coco8_disk
  metrics_output_path: ./runs/yolo26n_coco8_disk/metrics.json
  # Start from a previous run's checkpoint (overrides `pretrained` / variant
  # default for weight init). For full epoch+optimizer-state resume of an
  # interrupted run, also set `extra_overrides: { resume: true }`.
  # checkpoint: ./runs/yolo26n_coco8_disk/weights/last.pt
