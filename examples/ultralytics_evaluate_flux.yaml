# Evaluate a trained YOLO26 checkpoint via Ultralytics' native validator
# against an in-memory `dataflux.Flux` (no on-disk val directory required).
#
# Run:
#   marainer ultralytics-evaluate raidar/examples/ultralytics_evaluate_flux.yaml
#
# `weights` points at a `.pt` produced by `marainer ultralytics-train` (or
# any compatible YOLO26 checkpoint). The evaluator wraps it in a
# `FluxDetectionValidator` whose `__call__` skips the disk-resolution path
# when both `self.data` and `self.dataloader` are pre-set, so
# `check_det_dataset(args.data)` is never invoked.
#
# Metrics are written as a JSON sidecar at `metrics_output_path`, matching
# `marainer.evaluator.Evaluator.metrics_sidecar_path` so Navigaitor's
# `read_run_metrics` reads them uniformly across Lightning- and
# Ultralytics-driven runs.

eval_set: !class:dataflux.core.Flux()
  source: []   # replace with a real DataSource
  ops: []      # replace with the IQ → spectrogram → detection-target op chain

evaluator: !class:raidar.ultralytics_runner.UltralyticsEvaluator
  weights: ./runs/yolo26n_rfuav_flux/train/weights/best.pt
  data:
    val: !ref:eval_set
    names:
      0: drone-signal
    nc: 1
  imgsz: 640
  batch: 16
  experiment_name: yolo26n_rfuav_eval
  metrics_output_path: ./runs/yolo26n_rfuav_eval/metrics.json
